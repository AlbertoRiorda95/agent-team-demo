# Web image: static build + same-origin proxy to the orders service.
# Unprivileged nginx: listens on 8080, pid and temp files under /tmp.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /api/ {
        proxy_pass http://orders:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://orders:3000;
    }

    # Hashed build assets: cache for a year.
    location /assets/ {
        expires max;
        try_files $uri =404;
    }

    # SPA fallback (expires -1 sends no-cache; keeps the server-level headers).
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
