# Web image: static build + same-origin proxy to the orders service.
# Main config for the Alpine nginx package, run as the unprivileged `nginx`
# user: listens on 8080; pid and temp files under /tmp (read-only root fs).
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location /api/ {
            proxy_pass http://orders:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /health {
            proxy_pass http://orders:3000;
        }

        # Hashed build assets: cache for a year.
        location /assets/ {
            expires max;
            try_files $uri =404;
        }

        # SPA fallback (expires -1 sends no-cache; keeps the server-level headers).
        location / {
            expires -1;
            try_files $uri /index.html;
        }
    }
}
