# Local environment (and CI helper). Dev credentials only, never for a deployment.
#   docker compose up -d            Postgres on 5432
#   docker compose up -d --build    Postgres, orders (3000) and web (5173, nginx 8080)
# Rollback: docker compose down -v (drops the local data volume).
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders -d orders"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    restart: unless-stopped

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
      secrets: [npmrc]
    environment:
      DATABASE_URL: postgres://orders:orders@postgres:5432/orders
      PORT: "3000"
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:5173}
      # no default on purpose: set it in .env (see .env.example), openssl rand -hex 32
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env (openssl rand -hex 32)}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      secrets: [npmrc]
    ports:
      - "5173:8080"
    depends_on:
      - orders
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    restart: unless-stopped

volumes:
  pgdata:

# Build secret for the images: the user npm config with the read token for
# GitHub Packages, written by ./ci/registry.sh login (REGISTRY_TOKEN set).
# Used only during npm ci, never stored in an image. Set NPM_USERCONFIG if
# yours is not ~/.npmrc.
secrets:
  npmrc:
    file: ${NPM_USERCONFIG:-${HOME}/.npmrc}
